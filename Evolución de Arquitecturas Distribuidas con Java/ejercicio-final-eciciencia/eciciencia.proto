syntax = "proto3";

option java_multiple_files = true;
option java_package = "edu.eci.arsw.eciciencia";
option java_outer_classname = "EcicienciaProto";

service AttendeeService {
  rpc RegisterAttendee (RegisterAttendeeRequest) returns (RegisterAttendeeResponse);
  rpc GetAttendee (AttendeeRequest) returns (AttendeeResponse);
}

service AgendaService {
  rpc ListActivities (Empty) returns (ActivityList);
  rpc GetActivitiesByTimeSlot (TimeSlotRequest) returns (ActivityList);
}

service ReservationService {
  rpc ReserveWorkshopSeat (WorkshopReservationRequest) returns (WorkshopReservationResponse);
  rpc CancelWorkshopSeat (CancelReservationRequest) returns (CancelReservationResponse);
}

service CapacityService {
  rpc GetCapacityStatus (ActivityRequest) returns (CapacityStatus);
  rpc RegisterActivityAttendance (AttendanceRequest) returns (AttendanceResponse);
}

message Empty {
}

message Attendee {
  string id = 1;
  string fullName = 2;
  string email = 3;
  string attendeeType = 4;
}

message RegisterAttendeeRequest {
  Attendee attendee = 1;
}

message RegisterAttendeeResponse {
  bool success = 1;
  string message = 2;
  Attendee attendee = 3;
}

message AttendeeRequest {
  string attendeeId = 1;
}

message AttendeeResponse {
  bool found = 1;
  Attendee attendee = 2;
}

message Activity {
  string id = 1;
  string title = 2;
  string type = 3;
  string location = 4;
  string timeSlot = 5;
  int32 capacity = 6;
}

message ActivityRequest {
  string activityId = 1;
}

message ActivityList {
  repeated Activity activities = 1;
}

message TimeSlotRequest {
  string timeSlot = 1;
}

message WorkshopReservationRequest {
  string attendeeId = 1;
  string activityId = 2;
}

message WorkshopReservationResponse {
  bool success = 1;
  string message = 2;
  string reservationId = 3;
}

message CancelReservationRequest {
  string reservationId = 1;
  string attendeeId = 2;
}

message CancelReservationResponse {
  bool success = 1;
  string message = 2;
}

message CapacityStatus {
  string activityId = 1;
  int32 capacity = 2;
  int32 reservedSeats = 3;
  int32 availableSeats = 4;
}

message AttendanceRequest {
  string attendeeId = 1;
  string activityId = 2;
}

message AttendanceResponse {
  bool success = 1;
  string message = 2;
}
